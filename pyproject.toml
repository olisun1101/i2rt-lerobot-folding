[project]
name = "i2rt-lerobot-folding"
version = "0.1.0"
description = "I2RT YAM bimanual folding integration for LeRobot"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
